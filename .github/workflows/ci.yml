name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:app
      - run: npm run build

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local devnet
        run: |
          chmod +x scripts/ci-devnet.sh
          bash scripts/ci-devnet.sh
      - name: Run contract tests
        run: npm run test:contract
      - name: Stop local devnet
        if: always()
        run: npm run env:down
